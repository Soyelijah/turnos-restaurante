name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, pdo, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: composer --working-dir=backend install --no-interaction --no-progress --prefer-dist

      - name: Verify frontend and backend
        run: npm run check

      - name: Audit npm dependencies
        run: npm audit --audit-level=low
